<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mentalist OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="taskbar">
    <div class="left-side">
      <span class="badge">⭐ CBI</span>
      <span class="title">Mentalist OS</span>
    </div>
    
    <div class="right-side">
      <span id="clock">12:00 PM</span>
    </div>
  </header>

  <main id="desktop">
    
    <div class="window" id="devlog-app" style="top: 50px; left: 100px;">
      <div class="window-top">
        <span class="title">Investigator's Log</span>
        <button class="close-btn">X</button>
      </div>
      <div class="window-content">
        <p>Devlogs will go here later.</p>
      </div>
    </div>

    <div class="window" id="notes-app" style="top: 150px; left: 400px;">
      <div class="window-top">
        <span class="title">Field Notes</span>
        <button class="close-btn">X</button>
      </div>
      <div class="window-content">
        <textarea id="notes-input" placeholder="Type your case notes..."></textarea>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
